<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow - A simple daily task manager">
  <title>TaskFlow | Daily Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">MY WORKSPACE</p>
        <h1>TaskFlow<span>.</span></h1>
        <p class="subtitle">A little progress every day adds up.</p>
      </div>
      <div class="date" id="today"></div>
    </header>

    <section class="summary">
      <div class="summary-card">
        <span>Total tasks</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="summary-card">
        <span>Completed</span>
        <strong id="completedCount">0</strong>
      </div>
      <div class="summary-card">
        <span>Remaining</span>
        <strong id="remainingCount">0</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Add a task</h2>

      <form id="taskForm">
        <input
          id="taskInput"
          type="text"
          maxlength="100"
          placeholder="What needs to get done?"
          required
        >
        <button type="submit">Add task +</button>
      </form>

      <div class="toolbar">
        <h2>Your tasks</h2>

        <div class="filters">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <p id="emptyState" class="empty">
        No tasks here yet. Add your first task above.
      </p>

      <div class="panel-footer">
        <span id="statusText">Stay focused and keep going.</span>
        <button id="clearCompleted" class="text-button" type="button">
          Clear completed
        </button>
      </div>
    </section>

    <footer>
      Built with HTML, CSS and JavaScript.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
